<!doctype html>
<html>

<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: #FDF6F0; font-family: Nunito, 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #7B3FE4; text-decoration: none; } a:hover { color: #5926B0; }
    .dsp { font-family: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif; }
    button { font: inherit; color: inherit; border: 0; background: none; padding: 0; text-align: left; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .scroll { overflow-y: auto; scrollbar-width: none; }
    .scroll::-webkit-scrollbar { display: none; }

    .b3d { transition: transform .1s cubic-bezier(.34,1.56,.64,1), box-shadow .1s ease; }
    .b3d:hover { transform: translateY(-2px); }
    .b3d:active { transform: translateY(5px) !important; box-shadow: 0 1px 0 var(--sh) !important; }

    .card { transition: transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s ease; }
    .card:hover { transform: translateY(-4px); }
    .card:active { transform: translateY(2px); }

    @keyframes flick { 0%, 100% { transform: scale(1) rotate(-2deg); } 50% { transform: scale(1.13) rotate(3deg); } }
    .flame { animation: flick 1.7s ease-in-out infinite; transform-origin: 50% 92%; }

    @keyframes rise { from { opacity: 0; transform: translateY(16px) scale(.95); } to { opacity: 1; transform: none; } }
    .rise { animation: rise .55s cubic-bezier(.34,1.4,.64,1) both; }
    .g > *:nth-child(1) { animation-delay: .04s; }
    .g > *:nth-child(2) { animation-delay: .1s; }
    .g > *:nth-child(3) { animation-delay: .16s; }
    .g > *:nth-child(4) { animation-delay: .22s; }

    @keyframes shine { 0% { transform: translateX(-140%) rotate(16deg); } 55%, 100% { transform: translateX(420%) rotate(16deg); } }
    .shine { animation: shine 4s ease-in-out infinite; }

    @keyframes bob { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-5px) rotate(-4deg); } }
    .bob { animation: bob 3.2s ease-in-out infinite; }

    @keyframes tick { 0% { transform: scale(1); } 45% { transform: scale(1.3); } 100% { transform: scale(1); } }
    .tick { animation: tick .4s cubic-bezier(.34,1.6,.64,1); }
  </style>
</helmet>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#7B3FE4","options":["#7B3FE4","#0E9F8E","#E8467C","#F27A0C"],"section":"Tema"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: null };
  }

  dark(hex) {
    var m = /^#([0-9a-f]{6})$/i.exec(String(hex || ''));
    if (!m) return '#5926B0';
    var n = parseInt(m[1], 16);
    var r = Math.round(((n >> 16) & 255) * 0.66);
    var g = Math.round(((n >> 8) & 255) * 0.66);
    var b = Math.round((n & 255) * 0.66);
    return '#' + [r, g, b].map(function (v) { return ('0' + v.toString(16)).slice(-2); }).join('');
  }

  renderVals() {
    var accent = this.props.accent || '#7B3FE4';
    var names = {
      kenalan: 'Kenalan', pesan: 'Pesan & Beli', cerita: 'Cerita Kejadian', pendapat: 'Pendapat',
      progres: 'Update Progres', meeting: 'Meeting Survival', klien: 'Ngomong ke Klien', interview: 'Interview'
    };
    var self = this;
    var picks = {};
    var sel = {};
    Object.keys(names).forEach(function (k) {
      picks[k] = function () { self.setState({ picked: self.state.picked === k ? null : k }); };
      sel[k] = self.state.picked === k;
    });

    return {
      accent: accent,
      accentDark: this.dark(accent),
      picks: picks,
      sel: sel,
      cta: this.state.picked ? 'Mulai: ' + names[this.state.picked] : 'Mulai Pilihan Hari Ini'
    };
  }
}
