<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: #FDF6F0; font-family: Nunito, 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #7B3FE4; text-decoration: none; } a:hover { color: #5926B0; }
    .dsp { font-family: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif; }
    button { font: inherit; color: inherit; border: 0; background: none; padding: 0; text-align: left; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .scroll { overflow-y: auto; scrollbar-width: none; }
    .scroll::-webkit-scrollbar { display: none; }

    .b3d { transition: transform .1s cubic-bezier(.34,1.56,.64,1), box-shadow .1s ease; }
    .b3d:hover { transform: translateY(-2px); }
    .b3d:active { transform: translateY(4px) !important; box-shadow: 0 1px 0 var(--sh) !important; }

    .mic { transition: transform .12s cubic-bezier(.34,1.56,.64,1), box-shadow .12s ease, background .18s ease; touch-action: none; }
    .mic:hover { transform: translateY(-2px); }
    .mic:active { transform: translateY(6px) scale(1.03) !important; box-shadow: 0 2px 0 var(--sh) !important; }

    @keyframes breathe {
      0%, 100% { border-radius: 49% 51% 54% 46% / 53% 47% 53% 47%; transform: scale(1) rotate(0deg); }
      33%      { border-radius: 57% 43% 46% 54% / 44% 56% 44% 56%; transform: scale(1.055) rotate(5deg); }
      66%      { border-radius: 44% 56% 53% 47% / 56% 44% 59% 41%; transform: scale(.975) rotate(-4deg); }
    }
    .orb { animation: breathe 6.5s ease-in-out infinite; }
    .orb.think { animation: breathe 1.05s ease-in-out infinite; }
    .orb.talk { animation: breathe 2.1s ease-in-out infinite; }
    .orb.hush { animation: breathe 9s ease-in-out infinite; }

    @keyframes ripple { 0% { transform: scale(.7); opacity: .5; } 100% { transform: scale(1.35); opacity: 0; } }
    .rp { animation: ripple 3s ease-out infinite; }
    .rp2 { animation: ripple 3s ease-out infinite; animation-delay: 1.5s; }
    .rp.fast, .rp2.fast { animation-duration: 1.4s; }

    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .cr { animation: blink 1s steps(1) infinite; }

    @keyframes pop { 0% { transform: scale(1); } 42% { transform: scale(1.34); } 100% { transform: scale(1); } }
    .pop { animation: pop .48s cubic-bezier(.34,1.6,.64,1); }

    @keyframes halo { 0% { transform: scale(1); opacity: .45; } 100% { transform: scale(1.5); opacity: 0; } }
    .halo { animation: halo 1.5s ease-out infinite; }

    @keyframes inup { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .inup { animation: inup .34s cubic-bezier(.34,1.4,.64,1) both; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #FDF6F0; color: #241B33; display: flex; flex-direction: column; overflow: hidden">

  <!-- ── header ───────────────────────────────────── -->
  <div style="flex-shrink: 0; padding: 44px 16px 0">
    <div style="display: flex; align-items: center; gap: 10px">
      <button style="width: 38px; height: 38px; border-radius: 13px; background: #FFFFFF; box-shadow: 0 2px 0 #EFE1DC; display: flex; align-items: center; justify-content: center; color: #4A3E5C">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.5 5 8 12l6.5 7"></path>
        </svg>
      </button>

      <div style="flex: 1; text-align: center">
        <div class="dsp" style="font-size: 15.5px; font-weight: 800; line-height: 1.1">Saat Kamu Macet</div>
        <div style="font-size: 10.5px; font-weight: 700; color: #A99CB5; margin-top: 1px">{{status}}</div>
      </div>

      <div class="pop" style="display: flex; align-items: center; gap: 5px; background: #FFF3D6; border-radius: 999px; padding: 6px 11px 6px 8px; box-shadow: 0 2px 0 #F2DFA9">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
          <rect x="4" y="6" width="12" height="14" rx="2.4" fill="#FFD98A"></rect>
          <rect x="8" y="4" width="12" height="14" rx="2.4" fill="#FFB524"></rect>
        </svg>
        <span class="dsp" style="font-size: 13px; font-weight: 800; color: #8A5B00">{{frasa}}</span>
      </div>
    </div>

    <!-- session beats -->
    <div style="display: flex; gap: 5px; margin: 13px 4px 0">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="6">
        <div style="flex: 1; height: 7px; border-radius: 99px; background: {{s.bg}}; transition: background .35s ease"></div>
      </sc-for>
    </div>
  </div>

  <!-- ── AI presence ──────────────────────────────── -->
  <div style="flex-shrink: 0; height: 118px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
    <div style="position: relative; width: 104px; height: 78px; display: flex; align-items: center; justify-content: center">
      <div class="rp {{fast}}" style="position: absolute; width: 78px; height: 78px; border-radius: 50%; border: 2px solid {{accent}}"></div>
      <div class="rp2 {{fast}}" style="position: absolute; width: 78px; height: 78px; border-radius: 50%; border: 2px solid {{accent}}"></div>
      <div class="orb {{orbCls}}" style="width: 62px; height: 62px; background: radial-gradient(circle at 32% 26%, #CBB2FF, {{accent}} 58%, {{accentDark}} 100%); box-shadow: 0 10px 24px rgba(90,40,180,.32), inset 0 -7px 14px rgba(0,0,0,.14)"></div>
    </div>
    <div class="dsp" style="font-size: 12px; font-weight: 800; color: #9A8CA6; letter-spacing: .3px">ZII</div>
  </div>

  <!-- ── transcript ───────────────────────────────── -->
  <div class="scroll" ref="{{setSc}}" style="flex: 1; padding: 4px 18px 12px">
    <sc-for list="{{turns}}" as="t" hint-placeholder-count="3">
      <div style="display: flex; justify-content: {{t.just}}; margin-bottom: 13px">
        <div style="max-width: 290px">

          <div style="background: {{t.bg}}; color: {{t.fg}}; border-radius: {{t.radius}}; padding: 12px 15px; box-shadow: 0 3px 0 {{t.sh}}; font-size: 15px; font-weight: 600; line-height: 1.45; text-wrap: pretty">{{t.text}}<span class="cr" style="display: inline-block; width: 2px; height: 15px; background: {{t.caret}}; margin-left: 3px; vertical-align: -2px; border-radius: 1px"></span></div>

          <sc-if value="{{t.ai}}" hint-placeholder-val="{{true}}">
            <div style="display: flex; gap: 6px; margin-top: 7px">
              <button style="display: flex; align-items: center; gap: 5px; background: #FFFFFF; border-radius: 999px; padding: 5px 11px 5px 8px; box-shadow: 0 2px 0 #EADFE6; color: #6B5F7D">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M11 5.2 6.4 9H3.4v6h3l4.6 3.8V5.2Z"></path>
                  <path d="M15.4 9.4a3.6 3.6 0 0 1 0 5.2"></path>
                </svg>
                <span style="font-size: 11px; font-weight: 800">Ulangi</span>
              </button>
              <button style="display: flex; align-items: center; gap: 5px; background: #E8F4FF; border-radius: 999px; padding: 5px 11px 5px 8px; box-shadow: 0 2px 0 #CFE6FA; color: #1573C4">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3.4 6.6h7.8M7.3 4.4v2.2M5 12c1.4-3 2.3-4.4 2.3-4.4S8.2 9 9.6 12"></path>
                  <path d="M13.2 20l3.9-9.6L21 20M14.8 16.8h4.6"></path>
                </svg>
                <span style="font-size: 11px; font-weight: 800">Arti</span>
              </button>
            </div>
          </sc-if>

          <sc-if value="{{t.me}}" hint-placeholder-val="{{false}}">
            <div style="display: flex; justify-content: flex-end; margin-top: 6px">
              <button style="display: flex; align-items: center; gap: 4px; padding: 2px 4px; color: #A99CB5">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M16.6 3.9a2.1 2.1 0 0 1 3 3L8.4 18.1l-4.2 1.2 1.2-4.2L16.6 3.9Z"></path>
                </svg>
                <span style="font-size: 10.5px; font-weight: 800">Salah dengar? Perbaiki</span>
              </button>
            </div>
          </sc-if>

        </div>
      </div>
    </sc-for>
  </div>

  <!-- ── dock ─────────────────────────────────────── -->
  <div style="flex-shrink: 0; padding: 12px 20px 24px; background: #FDF6F0; border-top: 1px solid #F3E7E2">

    <div style="height: 36px; display: flex; align-items: center; justify-content: center">
      <sc-if value="{{rec}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; align-items: center; gap: 12px">
          <div style="display: flex; align-items: center; gap: 3px; height: 32px">
            <sc-for list="{{bars}}" as="b" hint-placeholder-count="15">
              <div style="width: 5px; height: {{b.h}}; border-radius: 3px; background: #FF7A3D; transition: height .09s linear"></div>
            </sc-for>
          </div>
          <span class="dsp" style="font-size: 15px; font-weight: 800; color: #D9531C; min-width: 34px">{{clock}}</span>
        </div>
      </sc-if>
      <sc-if value="{{quiet}}" hint-placeholder-val="{{true}}">
        <span style="font-size: 12.5px; font-weight: 700; color: #A99CB5">{{hint}}</span>
      </sc-if>
    </div>

    <div style="display: flex; align-items: flex-start; justify-content: center; gap: 18px; margin-top: 6px">

      <div style="width: 62px; display: flex; flex-direction: column; align-items: center; gap: 7px; padding-top: 19px">
        <button class="b3d" style="--sh: #1573C4; width: 58px; height: 58px; border-radius: 50%; background: #2E9BF0; box-shadow: 0 5px 0 #1573C4; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7.4 5.6v12.8M12 5.6v12.8"></path>
            <path d="M16.4 8.2h4.2M18.5 6.4v1.8" stroke-width="2"></path>
            <path d="M15.4 18.4l2.9-7.2 2.9 7.2M16.6 15.9h3.4" stroke-width="2"></path>
          </svg>
        </button>
        <span style="font-size: 10px; font-weight: 800; color: #1573C4; text-align: center; line-height: 1.2">Jeda &amp;<br>Terjemah</span>
      </div>

      <div style="position: relative; width: 100px; height: 100px; display: flex; align-items: center; justify-content: center">
        <sc-if value="{{quiet}}" hint-placeholder-val="{{true}}">
          <div class="halo" style="position: absolute; width: 100px; height: 100px; border-radius: 50%; background: {{accent}}; opacity: .22; pointer-events: none"></div>
        </sc-if>
        <button class="mic" onPointerDown="{{down}}" onPointerUp="{{up}}" onPointerLeave="{{up}}" onPointerCancel="{{up}}" style="--sh: {{micDark}}; position: relative; width: 100px; height: 100px; border-radius: 50%; background: {{micBg}}; box-shadow: 0 9px 0 {{micDark}}; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="2.4" width="6" height="11.2" rx="3"></rect>
            <path d="M5.3 11.3a6.7 6.7 0 0 0 13.4 0M12 18.1v3.5M9 21.6h6"></path>
          </svg>
        </button>
      </div>

      <div style="width: 62px; display: flex; flex-direction: column; align-items: center; gap: 7px; padding-top: 19px">
        <button class="b3d" style="--sh: #E3D6DE; width: 58px; height: 58px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 5px 0 #E3D6DE; display: flex; align-items: center; justify-content: center; color: #6B5F7D">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3.8 8.6A8.6 8.6 0 1 1 3.2 12"></path>
            <path d="M3.4 4v4.6h4.6"></path>
          </svg>
        </button>
        <span style="font-size: 10px; font-weight: 800; color: #8B7E9B; text-align: center; line-height: 1.2">Ulang<br>Kalimat</span>
      </div>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#7B3FE4","options":["#7B3FE4","#0E9F8E","#E8467C","#F27A0C"],"section":"Tema"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      phase: 'idle',
      levels: [7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7],
      ms: 0,
      step: 2,
      frasa: 128,
      turns: [
        { who: 'ai', text: 'Hey! So, tell me — what did you get up to this weekend?' },
        { who: 'me', text: 'I go to my friend house. We, uh...' },
        { who: 'ai', text: 'Nice. And if the word runs away from you, just say "how do you say..." — I got you.' }
      ]
    };
    this.tos = [];
  }

  componentWillUnmount() {
    clearInterval(this.iv);
    clearInterval(this.stream);
    this.tos.forEach(clearTimeout);
  }

  later(fn, ms) {
    var id = setTimeout(fn, ms);
    this.tos.push(id);
    return id;
  }

  dark(hex) {
    var m = /^#([0-9a-f]{6})$/i.exec(String(hex || ''));
    if (!m) return '#5926B0';
    var n = parseInt(m[1], 16);
    var c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(function (v) {
      return ('0' + Math.round(v * 0.66).toString(16)).slice(-2);
    });
    return '#' + c.join('');
  }

  startRec() {
    if (this.state.phase !== 'idle') return;
    var self = this;
    this.setState({ phase: 'rec', ms: 0 });
    clearInterval(this.iv);
    this.iv = setInterval(function () {
      var lv = [];
      for (var i = 0; i < 15; i++) {
        var mid = 1 - Math.abs(i - 7) / 9;
        lv.push(Math.round(6 + Math.random() * 26 * mid));
      }
      self.setState({ levels: lv, ms: self.state.ms + 90 });
    }, 90);
  }

  stopRec() {
    if (this.state.phase !== 'rec') return;
    clearInterval(this.iv);
    var self = this;
    var said = this.state.ms < 400
      ? 'Hmm... how do you say "nongkrong"?'
      : 'We just, uh... how do you say "nongkrong" in English?';

    var turns = this.state.turns.concat([{ who: 'me', text: said }]);
    this.setState({
      phase: 'thinking',
      levels: [7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7],
      turns: turns,
      step: Math.min(6, this.state.step + 1)
    });

    this.later(function () { self.speak('Perfect use of that! We say "hang out" — so: we just hung out.'); }, 950);
  }

  speak(line) {
    var self = this;
    var words = line.split(' ');
    var n = 0;
    var base = this.state.turns.concat([{ who: 'ai', text: '', live: true }]);
    this.setState({ phase: 'speaking', turns: base });

    clearInterval(this.stream);
    this.stream = setInterval(function () {
      n++;
      var t = self.state.turns.slice();
      t[t.length - 1] = { who: 'ai', text: words.slice(0, n).join(' '), live: n < words.length };
      self.setState({ turns: t });
      if (n >= words.length) {
        clearInterval(self.stream);
        self.later(function () {
          self.setState({ phase: 'idle', frasa: self.state.frasa + 1 });
        }, 420);
      }
    }, 85);
  }

  renderVals() {
    var self = this;
    var accent = this.props.accent || '#7B3FE4';
    var accentDark = this.dark(accent);
    var p = this.state.phase;

    var statusText = {
      idle: 'siap dengerin kamu',
      rec: 'kamu ngomong...',
      thinking: 'Zii mikir...',
      speaking: 'Zii ngomong'
    }[p];

    var steps = [];
    for (var i = 0; i < 6; i++) {
      steps.push({ bg: i < this.state.step ? '#10B981' : '#EFE4EA' });
    }

    var secs = Math.floor(this.state.ms / 1000);
    var clock = '0:' + (secs < 10 ? '0' : '') + secs;

    var turns = this.state.turns.map(function (t) {
      var ai = t.who === 'ai';
      return {
        ai: ai,
        me: !ai,
        text: t.text,
        just: ai ? 'flex-start' : 'flex-end',
        bg: ai ? '#FFFFFF' : accent,
        fg: ai ? '#241B33' : '#FFFFFF',
        sh: ai ? '#EADFE6' : accentDark,
        radius: ai ? '22px 22px 22px 7px' : '22px 22px 7px 22px',
        caret: t.live ? (ai ? '#241B33' : '#FFFFFF') : 'transparent'
      };
    });

    return {
      accent: accent,
      accentDark: accentDark,
      status: statusText,
      frasa: this.state.frasa,
      steps: steps,
      turns: turns,
      bars: this.state.levels.map(function (h) { return { h: h + 'px' }; }),
      clock: clock,
      rec: p === 'rec',
      quiet: p === 'idle',
      hint: p === 'idle' ? 'Tekan & tahan buat ngomong' : (p === 'thinking' ? 'Zii nyusun jawaban...' : 'Zii lagi ngomong — sabar bentar'),
      orbCls: p === 'thinking' ? 'think' : (p === 'speaking' ? 'talk' : (p === 'rec' ? 'hush' : '')),
      fast: p === 'speaking' ? 'fast' : '',
      micBg: p === 'rec' ? '#FF7A3D' : (p === 'idle' ? accent : '#C9BCD6'),
      micDark: p === 'rec' ? '#D9531C' : (p === 'idle' ? accentDark : '#A899B8'),
      down: function () { self.startRec(); },
      up: function () { self.stopRec(); },
      setSc: function (el) {
        if (el) { self.sc = el; el.scrollTop = el.scrollHeight; }
      }
    };
  }
}
</script>
</body>
</html>
