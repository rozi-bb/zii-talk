[project]
name = "zii-talk-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langgraph>=0.6",
    "langchain-openai>=0.3",
    "langchain-core>=0.3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pydantic>=2.9",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]

[dependency-groups]
dev = ["langgraph-cli[inmem]>=0.2"]

[tool.uv]
package = false
